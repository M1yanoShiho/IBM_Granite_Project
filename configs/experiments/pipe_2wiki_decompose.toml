# R7 arm, the low end of the MRR span (.5702 recorded) and the reason the span is wide
# enough to be informative. Kept at the defaults R1/R2 measured: include_original off,
# fusion rrf. See pipe_2wiki_bm25.toml for the shared design; only [retriever] differs.
[dataset]
manifest = "../../runs/twowiki/manifest.json"

[output]
directory = "../../runs/pipe-2wiki-decompose"

[retriever]
name = "decompose"
parameters = { base = { name = "strong-bm25" }, k = 60 }

[selector]
name = "top-k"

[generator]
name = "extractive"

[run]
top_k = 50
max_selected = 5
seed = 7
