# Local CPU-only smoke config: RRF hybrid over two SPARSE arms (no GPU/model needed),
# so the hybrid/fusion path is exercised locally. GPU hybrids use a granite-dense arm.
[dataset]
manifest = "../../tests/fixtures/reference_dataset/manifest.json"

[output]
directory = "../../runs/retr-ref-hybrid-rrf-sparse"

[retriever]
name = "hybrid"

[retriever.parameters]
fusion = "rrf"
k = 60
retrievers = [ { name = "bm25" }, { name = "strong-bm25" } ]

[selector]
name = "top-k"

[generator]
name = "extractive"

[run]
top_k = 3
max_selected = 2
seed = 7
