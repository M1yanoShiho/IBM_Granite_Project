schema_version = "experiment04.arm.v1"
arm_id = "ablation_top10"
table_role = "ablation"
model_manifest = "../../../docs/full-flow/experiments/04_frozen_three_module_system_evaluation_2026-08-21/artifacts/goal2_model_config_manifest.json"
