# R10 overlap sweep. chunk_size, max_selected and top_k are pinned to R9's anchor
# (= the production setting), so overlap is the only variable and the nominal evidence
# budget stays at 5 x 120 = 600 words throughout. overlap=20 is that anchor and was
# already run as chunk_2wiki_a-c120o20; it is not duplicated here.
[dataset]
manifest = "../../runs/twowiki/manifest.json"

[output]
directory = "../../runs/ovl-2wiki-c120o40"

[retriever]
name = "strong-bm25"
parameters = { k1 = 0.9, b = 0.4 }

[selector]
name = "top-k"

[generator]
name = "extractive"

[chunker]
chunk_size = 120
overlap = 40

[run]
top_k = 50
max_selected = 5
seed = 7
