# R7 arm, the upper end of the MRR span (.9828 recorded). See pipe_2wiki_bm25.toml for
# the shared design; only [retriever] differs.
[dataset]
manifest = "../../runs/twowiki/manifest.json"

[output]
directory = "../../runs/pipe-2wiki-hybrid-rrf"

[retriever]
name = "hybrid"

[retriever.parameters]
fusion = "rrf"
k = 60
retrievers = [ { name = "strong-bm25" }, { name = "granite-dense" } ]

[selector]
name = "top-k"

[generator]
name = "extractive"

[run]
top_k = 50
max_selected = 5
seed = 7
