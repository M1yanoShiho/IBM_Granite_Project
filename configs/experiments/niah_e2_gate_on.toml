# E2 gate-ON arm: the contrastive drop gate.
# Paths are relative to THIS file (configs/experiments/). Points at the injected
# dataset produced by evidence-rag-materialize-niah.
[dataset]
manifest = "../../runs/niah-injected/manifest.json"

[output]
directory = "../../runs/e2-gate-on"

[retriever]
name = "bm25"
parameters = { k1 = 1.5, b = 0.75 }

[selector]
name = "gated-corroboration"
parameters = { alpha = 0.6, margin = 2, support_cap = 1, top_n = 20 }

[generator]
name = "extractive"

[run]
top_k = 20
max_selected = 10
seed = 13
