# Canonical deployable seed-13 runtime. Weights and data remain external and are
# resolved only from explicit environment variables.
[dataset]
manifest = "${EVIDENCE_RAG_DATASET_MANIFEST}"

[output]
directory = "${EVIDENCE_RAG_OUTPUT_DIR}"

[retriever]
name = "hybrid"

[retriever.parameters]
fusion = "rrf"
k = 60
retrievers = [
  { name = "strong-bm25", parameters = { k1 = 0.9, b = 0.4 } },
  { name = "granite-dense", parameters = { embedder_model_id = "ibm-granite/granite-embedding-english-r2", model_snapshot = "${EVIDENCE_RAG_MODEL_CACHE}/models--ibm-granite--granite-embedding-english-r2/snapshots/47ea694b257b703fee9253d75c2b1f2985180498", revision = "47ea694b257b703fee9253d75c2b1f2985180498", model_config_sha256 = "bc4ad4e8cd50c0069292863117823f665da70bbbdea40fd4ea77d80609ade241", local_files_only = true } },
]

[selector]
name = "nli-risk-controlled"

[selector.parameters]
model_snapshot = "${EVIDENCE_RAG_MODEL_CACHE}/models--cross-encoder--nli-deberta-v3-base/snapshots/6c749ce3425cd33b46d187e45b92bbf96ee12ec7"
model_id = "cross-encoder/nli-deberta-v3-base"
revision = "6c749ce3425cd33b46d187e45b92bbf96ee12ec7"
model_config_sha256 = "897e756eb59d3183adb505952e7910e7cbc7750a43f3b3747a96b688d2b02a47"
checkpoint_path = "${EVIDENCE_RAG_SELECTOR_CHECKPOINT}"
checkpoint_sha256 = "86622bd9ab6391c9eb560133b01b0cf3744c3706638ff8b0bd38925b84bf72bf"
safe_threshold = 0.9212157130241394
max_delete = 2
local_files_only = true
device = "auto"

[generator]
name = "grounded-grc"

[generator.parameters]
model_snapshot = "${EVIDENCE_RAG_MODEL_CACHE}/models--ibm-granite--granite-4.1-3b/snapshots/c0650403e44e78ec0262dab1c90914c65b196c4e"
model_config_sha256 = "9a0e589b69e7d3ad9fb9fb2c844aa7d7156e052cb7ea4211de7de48ab7c8525c"
adapter_path = "${EVIDENCE_RAG_GENERATOR_ADAPTER}"
adapter_name = "grc"
adapter_weights_sha256 = "492d336c7acc32785becded707220dbdf1a8acf9a895630147fc4e8cd28d0707"
adapter_config_sha256 = "1918333d819e6007d3faf17d3497c4f4665f7c0d3cb032f510986cfdb9837942"
