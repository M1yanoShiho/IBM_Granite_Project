true_config_sha256 = "69f089550c668f52d585adb6b482e771d8819a10c8c4ce2ca83f44c96178c6e9"
device = "auto"
max_new_tokens = 256
temperature = 0.0
top_p = 1.0
entity_gate = "observe"

[run]
top_k = 10
max_selected = 10
seed = 13
