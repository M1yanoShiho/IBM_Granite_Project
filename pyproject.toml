[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "evidence-rag"
version = "0.1.0"
description = "Clean Retriever-Selector-Generator pipeline"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
granite = [
  "sentence-transformers>=3,<6",
  "torch>=2,<3",
  "transformers>=4.45,<5",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
evidence-rag-smoke = "evidence_rag.cli.smoke:main"

[tool.hatch.build]
include = ["src/evidence_rag/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests/typecheck.py"]
