schema_version = "1.0"
experiment_id = "selector-adaptive-risk-v1"

[model]
architecture = "shared-deberta-independent-sigmoid-heads-v1"
model_id = "cross-encoder/nli-deberta-v3-base"
revision = "6c749ce3425cd33b46d187e45b92bbf96ee12ec7"
model_weights_file = "model.safetensors"
model_sha256 = "d8148c6d49e0a7925134294c56326c71fe0ab1dc390e37355e00c7efbb488afa"
max_length = 512
truncation = "only_second"
input_fields = ["question", "candidate_text"]
output_activation = "independent-sigmoid"
torch_dtype = "float32"

[model.snapshot_files]
"added_tokens.json" = "a4b6bfe668f2b3cf6f0cd535e98a0663d2d0d4a4a15f13075ad3597d33985a23"
"config.json" = "897e756eb59d3183adb505952e7910e7cbc7750a43f3b3747a96b688d2b02a47"
"model.safetensors" = "d8148c6d49e0a7925134294c56326c71fe0ab1dc390e37355e00c7efbb488afa"
"special_tokens_map.json" = "ed7c099c988dbb414b18a6980d20cb57b91b7cd119f6f6941eb364b0e892e712"
"spm.model" = "c679fbf93643d19aab7ee10c0b99e460bdbc02fedf34b92b05af343b4af586fd"
"tokenizer.json" = "5124ef2ead1a10a717703bc436de7f353da76d6340e4587719b42b1693707964"
"tokenizer_config.json" = "f3eecd07c370ef0bf7dd3780d3cd68cf9c8b00c267e21a208ddcd8f82bfec1a6"

[labels]
protocol_version = "selector-labels-v2"
unjudged_policy = "mask"
niah_counterfactual = "protect=0,harm=1"
niah_required = "protect=1,harm=mask-unless-verified-clean-counterpart"
niah_verified_clean_counterpart = "protect=1,harm=0"
niah_other = "protect=mask,harm=mask"
twowiki_supporting = "protect=1,harm=mask"
twowiki_unjudged = "protect=mask,harm=mask"
provenance_is_model_input = false

[training]
seeds = [13, 42, 73]
learning_rate = 0.00002
epochs = 3
batch_size = 4
gradient_accumulation_steps = 4
niah_twowiki_ratio = "1:1"
unjudged_hard_negatives_per_query = 0
negative_sampling = "active-mask-supervision-only"
class_weighting = "inverse-sqrt-frequency-per-source-head-active-classes-only"
zero_frequency_policy = "masked-head-or-absent-class-contributes-no-loss-and-no-weight"

[sanity]
questions_per_dataset = 16
epochs = 30
minimum_training_accuracy = 0.95

[preflight]
sample_protocol_version = "selector-r004-preflight-v1"
sample_seed = 20260811
sample_role = "train-modelval"
questions_per_dataset = 100
candidates_per_query = 20
sample_order = "ascending-sha256(protocol,newline,dataset-kind,newline,query-id,newline,seed)"
token_audit_scope = "all-train-modelval-top20"
forward_scope = "sampled-200q-top20"
forward_pairs = 4000
forward_warmup_batches = 4
training_probe_microbatches = 12
training_probe_warmup_microbatches = 4
training_probe_source_role = "train-fit"
training_probe_pair_order = "ascending-sha256(dataset-kind,newline,query-id,newline,evidence-id,newline,seed)"
training_probe_checkpoint = "NOT_APPLICABLE_EPHEMERAL"

[preflight.expected_label_counts.niah]
queries = 1023
candidate_rows = 20460
train_fit_rows = 18400
train_modelval_rows = 2060
train_modelval_queries = 103
protect_0_harm_1 = 965
protect_1_harm_0 = 973
protect_1_harm_mask = 4016
protect_mask_harm_mask = 14506

[preflight.expected_label_counts."2wiki"]
queries = 3000
candidate_rows = 60000
train_fit_rows = 54000
train_modelval_rows = 6000
train_modelval_queries = 300
protect_1_harm_mask = 5922
protect_mask_harm_mask = 54078

[selection]
baseline_k = 10
min_keep = 7
candidate_caps = [1, 2, 3]
safe_score = "min(harm_score,1-protect_score)"
tie_break = "descending-retrieval-rank-then-evidence-id"
replacement_from_rank_11_to_20 = false
default_on_missing_dependency = "ABSTAIN_KEEP"

[crc]
protocol_version = "selector-expected-risk-crc-v1"
alpha = 0.01
correction = "(sum_loss+1)/(n+1)"
component_representative_seed = 20260811
fallback_policy = "P0_KEEP_TOPK10"

[evaluation]
bootstrap_samples = 10000
bootstrap_seed = 20260811
count_matched_repeats = 100
count_matched_seed = 20260811
harmful_ci_requirement = "lower>0"
recall_loss_target_pp = 1.0
recall_loss_ci_upper_hard_pp = 3.0
chain_loss_target_pp = 1.0
chain_loss_ci_upper_hard_pp = 3.0
