<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 1260 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG evidence selection architecture with two Granite roles</title>
  <desc id="desc">A RAG architecture diagram showing retrieval, evidence selection, LLM context, Granite as evidence selector, and Granite as answer generator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4f63"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a33a2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="720" fill="#fbfaf6"/>

  <text x="630" y="42" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#1d1d1f">
    RAG 架构：证据选择和答案生成是两个角色
  </text>
  <text x="630" y="76" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5c5a55">
    同一个 Granite 基础模型能力可以用于两种用法：先筛选证据，再基于证据生成回答
  </text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="40" y="150" width="140" height="90" rx="8" fill="#ffffff" stroke="#2f4f63" stroke-width="2"/>
    <text x="110" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">用户问题</text>
    <text x="110" y="213" text-anchor="middle" font-size="13" fill="#5c5a55">query</text>

    <rect x="225" y="128" width="165" height="132" rx="8" fill="#f4f0e8" stroke="#7c6f57" stroke-width="2"/>
    <text x="307" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">企业文档库</text>
    <text x="307" y="191" text-anchor="middle" font-size="13" fill="#5c5a55">政策 / 报告 / 记录</text>
    <text x="307" y="214" text-anchor="middle" font-size="13" fill="#8a4b2a">包含旧版本、噪声</text>
    <text x="307" y="236" text-anchor="middle" font-size="13" fill="#8a4b2a">相似但误导材料</text>

    <rect x="435" y="128" width="170" height="132" rx="8" fill="#eef5f2" stroke="#3b755f" stroke-width="2"/>
    <text x="520" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">候选检索</text>
    <text x="520" y="189" text-anchor="middle" font-size="13" fill="#5c5a55">BM25 / dense</text>
    <text x="520" y="211" text-anchor="middle" font-size="13" fill="#5c5a55">Query2Doc / HyDE</text>
    <text x="520" y="236" text-anchor="middle" font-size="13" fill="#3b755f">先找相关候选</text>

    <rect x="650" y="112" width="250" height="166" rx="8" fill="#fff5ee" stroke="#b5533f" stroke-width="3"/>
    <text x="775" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">证据选择模块</text>
    <text x="775" y="174" text-anchor="middle" font-size="13" fill="#5c5a55">规则式互证：支持 / 冲突 / 覆盖</text>
    <text x="775" y="198" text-anchor="middle" font-size="13" fill="#5c5a55">轻量选择器：学习可靠性分数</text>
    <text x="775" y="222" text-anchor="middle" font-size="13" fill="#a33a2a">可选：微调 Granite selector</text>
    <text x="775" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2a">角色 A：判断证据该不该选</text>

    <rect x="965" y="128" width="180" height="132" rx="8" fill="#eef2f8" stroke="#47698f" stroke-width="2"/>
    <text x="1055" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">LLM 上下文</text>
    <text x="1055" y="190" text-anchor="middle" font-size="13" fill="#5c5a55">已选择的可信证据</text>
    <text x="1055" y="213" text-anchor="middle" font-size="13" fill="#5c5a55">附来源或引用</text>
    <text x="1055" y="238" text-anchor="middle" font-size="13" fill="#47698f">输入给生成模型</text>

    <rect x="965" y="380" width="180" height="132" rx="8" fill="#ffffff" stroke="#2f4f63" stroke-width="2"/>
    <text x="1055" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1f">Granite generator</text>
    <text x="1055" y="441" text-anchor="middle" font-size="13" fill="#5c5a55">基于已选证据回答</text>
    <text x="1055" y="464" text-anchor="middle" font-size="13" fill="#5c5a55">生成最终答案与引用</text>
    <text x="1055" y="489" text-anchor="middle" font-size="13" font-weight="700" fill="#2f4f63">角色 B：写答案</text>

    <rect x="650" y="380" width="250" height="132" rx="8" fill="#fff8f6" stroke="#a33a2a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="775" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#a33a2a">被过滤或降权的材料</text>
    <text x="775" y="443" text-anchor="middle" font-size="13" fill="#5c5a55">过时 / 条件不适用</text>
    <text x="775" y="466" text-anchor="middle" font-size="13" fill="#5c5a55">片面 / 冲突 / 语义相似但误导</text>
    <text x="775" y="491" text-anchor="middle" font-size="13" fill="#a33a2a">不进入生成上下文</text>

    <rect x="165" y="555" width="930" height="94" rx="8" fill="#ffffff" stroke="#d8d2c8" stroke-width="1.5"/>
    <text x="630" y="586" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">实验路线</text>
    <text x="630" y="615" text-anchor="middle" font-size="14" fill="#5c5a55">第一步：规则式证据选择器  →  第二步：轻量机器学习选择器  →  第三步：如果有效，再微调 Granite selector</text>
    <text x="630" y="640" text-anchor="middle" font-size="13" fill="#7c6f57">Granite selector 和 Granite generator 不冲突：一个负责选证据，一个负责生成答案</text>

    <line x1="180" y1="195" x2="225" y2="195" stroke="#2f4f63" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="390" y1="195" x2="435" y2="195" stroke="#2f4f63" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="605" y1="195" x2="650" y2="195" stroke="#2f4f63" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="900" y1="195" x2="965" y2="195" stroke="#2f4f63" stroke-width="2.4" marker-end="url(#arrow)"/>
    <path d="M 1055 260 C 1055 310, 1055 338, 1055 380" fill="none" stroke="#2f4f63" stroke-width="2.4" marker-end="url(#arrow)"/>

    <path d="M 775 278 C 775 318, 775 340, 775 380" fill="none" stroke="#a33a2a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="675" y="333" font-size="13" fill="#a33a2a">误导证据降权</text>
  </g>
</svg>
